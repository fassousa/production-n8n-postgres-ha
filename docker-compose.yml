
x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:latest
  restart: unless-stopped
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=pgbouncer
    - DB_POSTGRESDB_PORT=6432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_prod}
    - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_admin}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_LOG_LEVEL=info
    - NODE_OPTIONS=--max-old-space-size=1536
  networks:
    - backend_net

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n-main
    networks:
      - backend_net

  n8n-main:
    <<: *n8n-common
    container_name: n8n_main_web
    ports:
      - "127.0.0.1:5678:5678"
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  n8n-worker:
    <<: *n8n-common
    command: worker --concurrency=10
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 2G
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: n8n_redis_queue
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend_net

  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n_prod}
      - POSTGRES_USER=${POSTGRES_USER:-n8n_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c log_min_duration_statement=500
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_admin} -d ${POSTGRES_DB:-n8n_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: n8n_pgbouncer
    restart: unless-stopped
    environment:
      - DB_USER=${POSTGRES_USER:-n8n_admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB:-n8n_prod}
      - LISTEN_PORT=6432
      - POOL_MODE=session
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=40
      - AUTH_TYPE=scram-sha-256
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend_net:
    driver: bridge